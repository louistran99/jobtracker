name: JobTracker
options:
  bundleIdPrefix: com.louistran.jobtracker
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  JobTrackerKit:
    path: Packages/JobTrackerKit
targets:
  JobTracker:
    type: application
    platform: iOS
    sources:
      - path: App/JobTracker
    dependencies:
      - package: JobTrackerKit
        product: Domain
      - package: JobTrackerKit
        product: Persistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louistran.jobtracker.JobTracker
        PRODUCT_NAME: JobTracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Job Tracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  JobTracker:
    build:
      targets:
        JobTracker: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: []
