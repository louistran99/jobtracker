  <meta name="description" content="About Us:

Grow was born to tackle a critical challenge: making mental health care more effective and accessible for everyone. Since launching in 2020, 15 million sessions have started on Grow, and we&#39;ve barely scratched the surface. We do it through a three-sided marketplace that empowers providers, augments insurance payors, and serves patients. Every solution we build reveals ten more waiting to be delivered, and that&#39;s just what gets us going. We&#39;ve backed that ambition with more than $328M in funding, including our Series D at a $3B valuation from Sequoia Capital, Transformation Capital, TCV, SignalFire, Menlo Ventures, Goldman Sachs Alternatives, and others.

At Grow, the work you do can literally change someone&#39;s life. Your work here doesn&#39;t stay on a screen; it impacts whether someone can find, afford, and access quality care. That ambition sets us apart, and offers you an endless runway to impact one of the world&#39;s most urgent issues. We don’t have passenger seats here. Everyone is driving something that matters.

This work deserves real commitment. So if you thrive on meeting problems head on, untangling serious complexity, and working at pace with the sharpest yet kindest people around, you&#39;ve come to the right place.


ABOUT THE ROLE

The Momentum team builds the experiences that support our clients in their mental health journey outside of active care — the 167 hours a week they&#39;re not in a session. The team owns what a client experiences between sessions and Grow&#39;s mobile apps end to end: session recaps, Intentions (commitments clients set with their therapist and carry into the week), and the consumer mobile experience we are building around them.

We&#39;re looking for an Engineering Manager to lead a full-stack, product-focused team of backend and iOS engineers through the next phase of that work: taking us from 0 to 1 as we learn what clients actually need, then from 1 to 100 as we build out the capabilities that serve those needs. The team is forming now and works with a dedicated product manager and designer.

This is a build-from-the-ground-up role. You&#39;ll set the team&#39;s direction, make the product and technical calls for a consumer app and the services behind it, and partner closely with product and design to shape what we build. We&#39;re looking for someone excited about this product space who wants a real hand in defining Grow&#39;s inter-session strategy.


WHY THIS ROLE MATTERS

Momentum is early. The team was recently formed and is establishing its footing, so the person in this seat has real influence over the team&#39;s technical foundation, its culture, and the direction of the product itself. You&#39;ll operate with meaningful ownership, move quickly, and see your work directly influence product direction, technical foundations, and client support on a national scale.


WHAT YOU&#39;LL BE DOING

 - Lead a full-stack team of backend and iOS engineers, hiring and growing them as the team scales its product from 0 to 1 to 100.

 - Own the roadmap with your product manager and designer, from hypothesis through shipped experiment, and own the metrics that tell us whether it worked.

 - Make the technical calls that will shape Momentum&#39;s foundation for years to come: what we build natively in the iOS app, what we ship as an experiment, what we instrument, and how the backend services are shaped.

 - Raise and maintain a high technical bar by reviewing code, driving architecture decisions, and contributing hands-on when needed.

 - Help define and influence Grow&#39;s inter-session strategy, working with Product to figure out what clients need between sessions.

 - Use data and client insight to guide decisions, measure impact, and adjust course quickly as we learn.

 - Create a team culture with strong operational rigor appropriate for a team that&#39;s finding product-market fit.

 - Build and coach a high-performance team that excels in execution, communication, and problem-solving: hire, develop, and promote engineers, and make the hard calls when needed.

 - Represent Momentum and its work to the broader engineering organization alongside peer EMs and leaders.


WHAT YOU BRING

 - 3+ years of experience as an engineering manager leading a product team, plus 6+ years as a hands-on engineer in backend, full-stack, or iOS engineering.

 - Experience leading a team that included iOS or mobile engineers, and the ability to engage credibly with their work. A native iOS engineering background is not required.

 - Experience shipping consumer products that people use regularly, with outcomes you owned and metrics you moved.

 - Technical depth as a leader: you review code, drive architecture decisions, and can reason through system design trade-offs for a mobile and backend product, and you&#39;re willing to get hands-on when the team needs it.

 - Strong product sense with the ability to articulate vision and drive it to execution, working with product and design as peers.

 - Demonstrated ability to deliver complex programs in ambiguous environments.

 - Highly data-driven decision-making approach.

 - Experience building high-performance teams: hiring, developing, and promoting engineers, and handling performance.

 - Excellent communication and cross-functional leadership.

 - Founder&#39;s mindset: ownership, speed, scrappiness, problem-solving.


NICE TO HAVE

 - A native iOS engineering background, or current fluency with Swift and SwiftUI.

 - Experience with growth or experimentation-driven consumer products.

 - Experience building products used by patients or clinicians, or systems used by mental health or healthcare professionals.

 - A startup, incubation, or 0-to-1 chapter.


ROLE DETAILS:

 - Employment Type: Full Time, Exempt

 - Base Compensation: $224,000–$300,000 USD Annually

Work Arrangement: Hybrid, with required in-office presence 3 days per week at our San Francisco, New York, or Seattle office. This role also includes travel 2–3 times per year for company and department offsites.

Full Time Employee Benefits:

 - Health Benefits: Comprehensive medical, dental, vision, life, and disability coverage.

 - Grow for Grow: No cost access to therapy through the Grow platform (available to US employees)

 - Financial Wellness: Retirement savings programs and equity opportunities to help you invest in your future.

 - Flexible Time Off, Paid Holidays &amp; Winter Break: Flexible time off, company paid holidays (which vary by country), and a full company wide Winter Break to rest and recharge

 - Parental Leave: Up to 18 weeks of paid parental leave to support you and your growing family and a new child stipend.

 - Mental Health Mornings/Afternoons: Dedicated weekly flexible time for self care, whether that&#39;s therapy, exercise, journaling, time with family, or simply taking a break.

 - Wellness &amp; Development Stipend: Annual stipend to support your personal wellbeing and professional growth, from fitness and education to books and learning resources.

 - Commuter Benefits: Pre tax commuter benefits to support teammates working from one of our hub locations.

 - Home Office &amp; Meals: Support for your home workspace plus meal benefits, with offerings tailored to both remote and hub based employees.

 - Additional Perks: A variety of wellbeing benefits, including wellness memberships, virtual care, pet insurance discounts (where available), and global travel assistance.


Research shows that some groups hesitate to apply unless they meet every qualification. If you’re excited about this role but don’t check every box, we encourage you to apply. At Grow, we value diverse experiences, transferable skills, and the unique strengths each person brings.

Grow Therapy is proud to be an equal opportunity workplace and is an affirmative action employer. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or Veteran status. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements.

Use of AI Tools: We use certain AI and automated tools to support recruitment. These tools help our team review applications, organize interviews, detect potential application integrity issues, and maintain interview records; they do not make final hiring decisions.

Application Review: Ashby&#39;s AI-Assisted Application Review helps review application materials against role-specific criteria and may flag potential fraud or integrity issues for recruiter review. All advancement decisions are made by our human recruiting team after independent review. See Ashby&#39;s AI Bias Audit Report https://trust.ashbyhq.com/item/ai-bias-audit-report.

Interview Recording: We use BrightHire to record interviews, supporting note-taking and consistency across candidates. Learn more https://help.brighthire.ai/en/articles/4484370-brighthire-for-candidates-faq. Interviews are confidential; you may ask your interviewer to stop recording anytime, or opt out in advance https://app.brighthire.ai/candidate-opt-out/kcrUeiitS5Khw5AcWW_jLg. Choosing not to be recorded will not, by itself, affect your candidacy.

AI-Assisted Recruiter Screen: For select roles, BrightHire&#39;s AI features may help structure initial recruiter screens and organize interview notes. All responses are reviewed by our recruiting team; no hiring decisions are made by AI alone.

State-specific notices: Depending on your location, you may have additional rights. Illinois: If AI analyzes a video interview, we&#39;ll provide notice, explain how it works and what it evaluates, and obtain consent beforehand. New York City: Where required, we&#39;ll provide at least 10 business days’ notice before using an automated employment decision tool and explain how to request an alternative process. Maryland: We do not use facial recognition to create facial templates during interviews unless required notice and written consent are obtained.

Questions, accommodation requests, requests for an alternative selection process, objections to recording, or concerns about AI use? Contact talentops@growtherapy.com. We’re happy to help or offer an alternative way to participate." />

    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Engineering Manager, Momentum","description":"<p style=\"min-height:1.5em\"><strong>About Us:</strong></p><p style=\"min-height:1.5em\">Grow was born to tackle a critical challenge: making mental health care more effective and accessible for everyone. Since launching in 2020, 15 million sessions have started on Grow, and we've barely scratched the surface. We do it through a three-sided marketplace that empowers providers, augments insurance payors, and serves patients. Every solution we build reveals ten more waiting to be delivered, and that's just what gets us going. We've backed that ambition with more than $328M in funding, including our Series D at a $3B valuation from Sequoia Capital, Transformation Capital, TCV, SignalFire, Menlo Ventures, Goldman Sachs Alternatives, and others.</p><p style=\"min-height:1.5em\">At Grow, the work you do can literally change someone's life. Your work here doesn't stay on a screen; it impacts whether someone can find, afford, and access quality care. That ambition sets us apart, and offers you an endless runway to impact one of the world's most urgent issues. We don’t have passenger seats here. Everyone is driving something that matters.</p><p style=\"min-height:1.5em\">This work deserves real commitment. So if you thrive on meeting problems head on, untangling serious complexity, and working at pace with the sharpest yet kindest people around, you've come to the right place.</p><p style=\"min-height:1.5em\"></p><h2><strong>About the role</strong></h2><p style=\"min-height:1.5em\">The Momentum team builds the experiences that support our clients in their mental health journey outside of active care — the 167 hours a week they're not in a session. The team owns what a client experiences between sessions and Grow's mobile apps end to end: session recaps, Intentions (commitments clients set with their therapist and carry into the week), and the consumer mobile experience we are building around them.</p><p style=\"min-height:1.5em\">We're looking for an Engineering Manager to lead a full-stack, product-focused team of backend and iOS engineers through the next phase of that work: taking us from 0 to 1 as we learn what clients actually need, then from 1 to 100 as we build out the capabilities that serve those needs. The team is forming now and works with a dedicated product manager and designer.</p><p style=\"min-height:1.5em\">This is a build-from-the-ground-up role. You'll set the team's direction, make the product and technical calls for a consumer app and the services behind it, and partner closely with product and design to shape what we build. We're looking for someone excited about this product space who wants a real hand in defining Grow's inter-session strategy.</p><p style=\"min-height:1.5em\"></p><h2><strong>Why This Role Matters</strong></h2><p style=\"min-height:1.5em\">Momentum is early. The team was recently formed and is establishing its footing, so the person in this seat has real influence over the team's technical foundation, its culture, and the direction of the product itself. You'll operate with meaningful ownership, move quickly, and see your work directly influence product direction, technical foundations, and client support on a national scale.</p><p style=\"min-height:1.5em\"></p><h2><strong>What You'll Be Doing</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead a full-stack team of backend and iOS engineers, hiring and growing them as the team scales its product from 0 to 1 to 100.</p></li><li><p style=\"min-height:1.5em\">Own the roadmap with your product manager and designer, from hypothesis through shipped experiment, and own the metrics that tell us whether it worked.</p></li><li><p style=\"min-height:1.5em\">Make the technical calls that will shape Momentum's foundation for years to come: what we build natively in the iOS app, what we ship as an experiment, what we instrument, and how the backend services are shaped.</p></li><li><p style=\"min-height:1.5em\">Raise and maintain a high technical bar by reviewing code, driving architecture decisions, and contributing hands-on when needed.</p></li><li><p style=\"min-height:1.5em\">Help define and influence Grow's inter-session strategy, working with Product to figure out what clients need between sessions.</p></li><li><p style=\"min-height:1.5em\">Use data and client insight to guide decisions, measure impact, and adjust course quickly as we learn.</p></li><li><p style=\"min-height:1.5em\">Create a team culture with strong operational rigor appropriate for a team that's finding product-market fit.</p></li><li><p style=\"min-height:1.5em\">Build and coach a high-performance team that excels in execution, communication, and problem-solving: hire, develop, and promote engineers, and make the hard calls when needed.</p></li><li><p style=\"min-height:1.5em\">Represent Momentum and its work to the broader engineering organization alongside peer EMs and leaders.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>What You Bring</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">3+ years of experience as an engineering manager leading a product team, plus 6+ years as a hands-on engineer in backend, full-stack, or iOS engineering.</p></li><li><p style=\"min-height:1.5em\">Experience leading a team that included iOS or mobile engineers, and the ability to engage credibly with their work. A native iOS engineering background is not required.</p></li><li><p style=\"min-height:1.5em\">Experience shipping consumer products that people use regularly, with outcomes you owned and metrics you moved.</p></li><li><p style=\"min-height:1.5em\">Technical depth as a leader: you review code, drive architecture decisions, and can reason through system design trade-offs for a mobile and backend product, and you're willing to get hands-on when the team needs it.</p></li><li><p style=\"min-height:1.5em\">Strong product sense with the ability to articulate vision and drive it to execution, working with product and design as peers.</p></li><li><p style=\"min-height:1.5em\">Demonstrated ability to deliver complex programs in ambiguous environments.</p></li><li><p style=\"min-height:1.5em\">Highly data-driven decision-making approach.</p></li><li><p style=\"min-height:1.5em\">Experience building high-performance teams: hiring, developing, and promoting engineers, and handling performance.</p></li><li><p style=\"min-height:1.5em\">Excellent communication and cross-functional leadership.</p></li><li><p style=\"min-height:1.5em\">Founder's mindset: ownership, speed, scrappiness, problem-solving.</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Nice To Have</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A native iOS engineering background, or current fluency with Swift and SwiftUI.</p></li><li><p style=\"min-height:1.5em\">Experience with growth or experimentation-driven consumer products.</p></li><li><p style=\"min-height:1.5em\">Experience building products used by patients or clinicians, or systems used by mental health or healthcare professionals.</p></li><li><p style=\"min-height:1.5em\">A startup, incubation, or 0-to-1 chapter.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Role Details:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Employment Type:</strong> Full Time, Exempt</p></li><li><p style=\"min-height:1.5em\"><strong>Base Compensation:</strong> $224,000–$300,000 USD Annually</p></li></ul><p style=\"min-height:1.5em\"><strong>Work Arrangement:</strong> Hybrid, with required in-office presence 3 days per week at our San Francisco, New York, or Seattle office. This role also includes travel 2–3 times per year for company and department offsites.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Full Time Employee Benefits:</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Health Benefits</strong>: Comprehensive medical, dental, vision, life, and disability coverage.</p></li><li><p style=\"min-height:1.5em\"><strong>Grow for Grow:</strong> No cost access to therapy through the Grow platform (available to US employees)</p></li><li><p style=\"min-height:1.5em\"><strong>Financial Wellness</strong>: Retirement savings programs and equity opportunities to help you invest in your future.</p></li><li><p style=\"min-height:1.5em\"><strong>Flexible Time Off, Paid Holidays &amp; Winter Break</strong>: Flexible time off, company paid holidays (which vary by country), and a full company wide Winter Break to rest and recharge</p></li><li><p style=\"min-height:1.5em\"><strong>Parental Leave</strong>: Up to 18 weeks of paid parental leave to support you and your growing family and a new child stipend.</p></li><li><p style=\"min-height:1.5em\"><strong>Mental Health Mornings/Afternoons</strong>: Dedicated weekly flexible time for self care, whether that's therapy, exercise, journaling, time with family, or simply taking a break.</p></li><li><p style=\"min-height:1.5em\"><strong>Wellness &amp; Development Stipend</strong>: Annual stipend to support your personal wellbeing and professional growth, from fitness and education to books and learning resources.</p></li><li><p style=\"min-height:1.5em\"><strong>Commuter Benefits:</strong> Pre tax commuter benefits to support teammates working from one of our hub locations.</p></li><li><p style=\"min-height:1.5em\"><strong>Home Office &amp; Meals</strong>: Support for your home workspace plus meal benefits, with offerings tailored to both remote and hub based employees.</p></li><li><p style=\"min-height:1.5em\"><strong>Additional Perks:</strong> A variety of wellbeing benefits, including wellness memberships, virtual care, pet insurance discounts (where available), and global travel assistance.</p></li></ul><p style=\"min-height:1.5em\"><br /><em>Research shows that some groups hesitate to apply unless they meet every qualification. If you’re excited about this role but don’t check every box, we encourage you to apply. At Grow, we value diverse experiences, transferable skills, and the unique strengths each person brings.</em></p><p style=\"min-height:1.5em\"><em>Grow Therapy is proud to be an equal opportunity workplace and is an affirmative action employer. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or Veteran status. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em><strong>Use of AI Tools: </strong>We use certain AI and automated tools to support recruitment. These tools help our team review applications, organize interviews, detect potential application integrity issues, and maintain interview records; <strong>they do not make final hiring decisions.</strong></em></p><p style=\"min-height:1.5em\"><em><strong>Application Review:</strong> Ashby's AI-Assisted Application Review helps review application materials against role-specific criteria and may flag potential fraud or integrity issues for recruiter review. All advancement decisions are made by our human recruiting team after independent review. See Ashby's</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://trust.ashbyhq.com/item/ai-bias-audit-report\"><em> <u>AI Bias Audit Report</u></em></a><em>.</em></p><p style=\"min-height:1.5em\"><em><strong>Interview Recording:</strong> We use BrightHire to record interviews, supporting note-taking and consistency across candidates.</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://help.brighthire.ai/en/articles/4484370-brighthire-for-candidates-faq\"><em> <u>Learn more</u></em></a><em>. Interviews are confidential; you may ask your interviewer to stop recording anytime, or</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://app.brighthire.ai/candidate-opt-out/kcrUeiitS5Khw5AcWW_jLg\"><em> <u>opt out in advance</u></em></a><em>. Choosing not to be recorded will not, by itself, affect your candidacy.</em></p><p style=\"min-height:1.5em\"><em><strong>AI-Assisted Recruiter Screen:</strong> For select roles, BrightHire's AI features may help structure initial recruiter screens and organize interview notes. All responses are reviewed by our recruiting team; no hiring decisions are made by AI alone.</em></p><p style=\"min-height:1.5em\"><em><strong>State-specific notices:</strong> Depending on your location, you may have additional rights. Illinois: If AI analyzes a video interview, we'll provide notice, explain how it works and what it evaluates, and obtain consent beforehand. New York City: Where required, we'll provide at least 10 business days’ notice before using an automated employment decision tool and explain how to request an alternative process. Maryland: We do not use facial recognition to create facial templates during interviews unless required notice and written consent are obtained.</em></p><p style=\"min-height:1.5em\"><em>Questions, accommodation requests, requests for an alternative selection process, objections to recording, or concerns about AI use? Contact talentops@growtherapy.com. We’re happy to help or offer an alternative way to participate.</em></p>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Grow Therapy","value":"eb6b5a30-a02d-47b7-83ac-51839574d2d2"},"datePosted":"2026-07-02","hiringOrganization":{"@type":"Organization","name":"Grow Therapy","sameAs":"http://www.growtherapy.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/215703da-5df0-4d8e-bacb-0c2f7b9519bf/fa207005-968b-4166-9cbe-077c9
